   <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('contactForm');
            // Use unique IDs for Contact form elements to avoid conflict with Enquiry form
            const nameInput = document.getElementById('name_contact');
            const emailInput = document.getElementById('email_contact');
            const messageInput = document.getElementById('message_contact');
            const formFeedback = document.getElementById('formFeedback_contact');

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            form.addEventListener('submit', function(event) {
                event.preventDefault(); // Stop default submission
                let isValid = true;

                // --- Validation Functions ---

                // 1. Validate Name (must be at least 5 characters)
                if (nameInput.value.trim().length < 5) {
                    displayError('nameError_contact', 'Name must be at least 2 characters long.');
                    isValid = false;
                } else {
                    displayError('nameError_contact', '');
                }

                // 2. Validate Email
                if (!emailPattern.test(emailInput.value.trim())) {
                    displayError('emailError_contact', 'Please enter a valid email address.');
                    isValid = false;
                } else {
                    displayError('emailError_contact', '');
                }

                // 3. Validate Message (must be at least 15 characters, assuming a detailed contact)
                if (messageInput.value.trim().length < 15) {
                    displayError('messageError_contact', 'Your message must be at least 15 characters long.');
                    isValid = false;
                } else {
                    displayError('messageError_contact', '');
                }
                     function validateAndSubmit() {
          const name = document.getElementById('name').value;
          const email = document.getElementById('email').value;
          const message = document.getElementById('message').value;
          const errorMessage = document.getElementById('error-message');
          const form = document.getElementById('contactForm');
          
          errorMessage.textContent = ''; // Clear previous error

          // 1. Check for required fields (All input fields are required!!!)
          if (!name || !email || !message) {
              errorMessage.textContent = 'All input fields are required!!!';
              return; // Stop the submission
          }

          // 2. Check for incorrect email format (Incorrect email format!!!)
          // Basic email regex validation
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailRegex.test(email)) {
              errorMessage.textContent = 'Incorrect email format!!!';
              return; // Stop the submission
          }
          
          // 3. Show Success Alert (Your form was submitted successfully!!!)
          alert("This page says\nYour form was submitted successfully!!!");
          
          // 4. Submit the form to the PHP script (submit_contact.php)
          // The form will now proceed to the 'action' URL defined in the HTML.
          form.submit();
      } 

                // --- Handle Submission ---
                if (isValid) {
                    // All fields are valid.
                    // NOTE: The 'email recipient processing' mentioned in the checklist requires server-side code (PHP, Node.js, etc.) 
                    // which is outside the scope of this client-side JS. We'll simulate the successful process here.
                    
                    formFeedback.textContent = 'Message sent successfully! We will respond shortly.';
                    formFeedback.style.color = 'yellow';
                    form.reset(); // Clear the form
                    // In a real application, you would use fetch() here to send data to submit_contact.php
                } else {
                    formFeedback.textContent = 'Please correct the highlighted errors.';
                    formFeedback.style.color = 'red';
                }
            });

            function displayError(id, message) {
                const errorElement = document.getElementById(id);
                errorElement.textContent = message;
                errorElement.style.color = 'red';
            }
        });
        /**
 * Updates the footer element with the current time and date every second.
 */
function updateClock() {
    const now = new Date();
    
    // Formatting options for time (e.g., 02:30:15 PM)
    const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
    const timeString = now.toLocaleTimeString('en-US', timeOptions);

    // Formatting options for date (e.g., Wednesday, November 19, 2025)
    const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    const dateString = now.toLocaleDateString('en-US', dateOptions);

    const displayElement = document.getElementById('real-time-content');
    
    if (displayElement) {
        // Update the content of the footer element
        displayElement.innerHTML = `Current Time: ${timeString} | Today's Date: ${dateString}`;
    }
}

// Call the function immediately to avoid a 1-second delay, then set it to run every 1000ms (1 second)
updateClock();
setInterval(updateClock, 1000);

    </script>
