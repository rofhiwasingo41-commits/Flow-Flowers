        <section>
            <h2>Ask us anything</h2>
            <form id="enquiryForm" action="submit_enquiry.php" method="post">
              <label>Name:</label><br>
              <input type="text" name="name" required><br><br>
        
              <label>Email:</label><br>
              <input type="email" name="email" required><br><br>
        
              <label>Your Enquiry:</label><br>
              <textarea name="message" rows="5" required></textarea><br><br>
        
              <button type="submit" onclick="validateAndSubmitEnquiry()">Submit</button>

              <p id="error-message" style="color: red; font-weight: bold; margin-top: 10px;"></p>
            
            </form>

            <p id="successMessage" style="font-weight: bold; color: yellow; display: none;">Message Sent</p>
          </section>
          <script>
       document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('enquiryForm');
         });
          function validateAndSubmitEnquiry() { 
                const name = document.getElementById('name').value;
 const email = document.getElementById('email').value;
                const message = document.getElementById('message').value;
                const errorMessage = document.getElementById('error-message');
                const form = document.getElementById('enquiryForm');
                
errorMessage.textContent = '';
 // Clear previous error

                //  Check for required fields (All input fields are required!!!)
                if (!name || !email || !message) {
                    errorMessage.textContent = 'All input fields are required!!!';
return; // Stop the submission
                };
                // Check for incorrect email format (Incorrect email format!!!)
                // Basic email regex validation
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
 if (!emailRegex.test(email)) {
                    errorMessage.textContent = 'Incorrect email format!!!';
 return; // Stop the submission
                };

 //  Show Success Alert (Your form was submitted successfully!!!)
                alert("This page says\nYour form was submitted successfully!!!");
 //  Submit the form to the PHP script (submit_enquiry.php)
                form.submit();
}



            // added listener for form submisssion
            document.getElementById('enquiryForm').addEventListener('submit', function(event) {
                // Prenvent the Default action - NOT needed if validateAndSubmitEnquiry() handles submission
                 event.preventDefault();
//This would typically end the data to the server here using fetch() or XMLHttpRequest

                // Hide the form - The following line is logically wrong (it displays 'block' to hide)
                 Document.getElementById('enquiryForm').style.display = 'block';
                //  //showing success message

                // This section can be kept if you decide to fully manage the success message display after submission
                document.getElementById('successMessage').style.display = 'block';
 }); // Corrected syntax

/**
 * Updates the footer element with the current time and date every second.
 */
function updateClock() {
    const now = new Date();
    
    // Formatting options for time (e.g., 02:30:15 PM)
    const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
    const timeString = now.toLocaleTimeString('en-US', timeOptions);

    // Formatting options for date (e.g., Wednesday, November 19, 2025)
    const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    const dateString = now.toLocaleDateString('en-US', dateOptions);

    const displayElement = document.getElementById('real-time-content');
    
    if (displayElement) {
        // Update the content of the footer element
        displayElement.innerHTML = `Current Time: ${timeString} | Today's Date: ${dateString}`;
    }
}

// Call the function immediately to avoid a 1-second delay, then set it to run every 1000ms (1 second)
updateClock();
setInterval(updateClock, 1000);

</script>
